# Deploy = Cloud Manager's "Deploy to environment" step, for a single Docker host (any VM with docker compose).
# Pipeline: pull images -> start/refresh publish+dispatcher+catalog-api -> install the `all` package on author & publish
# -> smoke test through the dispatcher. Author is bound to 127.0.0.1 on the VM (reach it via: ssh -L 4502:localhost:4502 ...).
#
# Required repo secrets:  DEPLOY_HOST (ip/dns), DEPLOY_USER, DEPLOY_SSH_KEY (private key), AEM_ADMIN_PASSWORD
# Optional:               STOREFRONT_REVALIDATE_URL (Vercel URL of /api/revalidate incl. secret)
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      REVALIDATE_URL: ${{ secrets.STOREFRONT_REVALIDATE_URL }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Check target
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "::notice::No DEPLOY_HOST secret configured — nothing to deploy to yet (set DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, AEM_ADMIN_PASSWORD)."; fi
      - uses: actions/checkout@v4
        if: env.DEPLOY_HOST != ''
      - uses: actions/setup-java@v4
        if: env.DEPLOY_HOST != ''
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        if: env.DEPLOY_HOST != ''
        with: { node-version: '20' }
      - name: Build the `all` package
        if: env.DEPLOY_HOST != ''
        working-directory: blueshelf
        run: mvn -B -ntp -DskipTests clean package
      - name: Prepare SSH
        if: env.DEPLOY_HOST != ''
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Ship compose + dispatcher config, start containers
        if: env.DEPLOY_HOST != ''
        env: { H: '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' }
        run: |
          ssh $H 'mkdir -p ~/blueshelf'
          scp infra/docker-compose.prod.yml $H:~/blueshelf/docker-compose.yml
          scp dispatcher/dispatcher.any $H:~/blueshelf/dispatcher.any
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ssh $H "cd ~/blueshelf && echo OWNER=$OWNER > .env && docker compose pull && docker compose up -d"
      - name: Wait for author & publish, install the package on both (= Cloud Manager deploy to author+publish)
        if: env.DEPLOY_HOST != ''
        env: { H: '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}', PW: '${{ secrets.AEM_ADMIN_PASSWORD }}' }
        run: |
          scp blueshelf/all/target/blueshelf.all-*.zip $H:~/blueshelf/all.zip
          ssh $H "for p in 4502 4503; do for i in \$(seq 1 60); do curl -fs -u admin:$PW http://localhost:\$p/system/console/bundles.json | grep -q 'all .* bundles active' && break; sleep 5; done; done
            for p in 4502 4503; do curl -fs -u admin:$PW -F file=@\$HOME/blueshelf/all.zip -F force=true http://localhost:\$p/bin/cpm/package.upload.json | head -c 200; echo; \
              curl -fs -u admin:$PW -X POST http://localhost:\$p/bin/cpm/package.install.json/com.blueshelf/blueshelf.all-1.0.0-SNAPSHOT.zip | head -c 200; echo; done"
      - name: Smoke test via dispatcher
        if: env.DEPLOY_HOST != ''
        run: |
          sleep 30
          curl -fsS -D - -o /dev/null "http://${{ secrets.DEPLOY_HOST }}/content/blueshelf/us/en.html" | grep -iE "HTTP/|x-cache"
          curl -fsS "http://${{ secrets.DEPLOY_HOST }}/content/blueshelf/us/en.model.json" | head -c 200
      - name: Revalidate storefront
        if: env.REVALIDATE_URL != ''
        run: curl -fsS -X POST "$REVALIDATE_URL"
