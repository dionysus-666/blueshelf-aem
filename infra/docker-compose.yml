# Local "AEM-like" topology.
#   author  -> http://localhost:4502   (AEM author default port)
#   publish -> http://localhost:4503   (AEM publish default port)
# Both are Apache Sling Starter 14 = Felix OSGi + Oak JCR + Sling + HTL + Sling Models,
# i.e. the open-source engine AEM is built on. Credentials: admin / admin.
#
# GOTCHA (AEM): author & publish are *separate repositories*. Content moves author->publish
# only by replication/activation. We model that honestly: two independent containers.
services:
  author:
    image: apache/sling:14
    container_name: blueshelf-author
    ports:
      - "4502:8080"
    volumes:
      - author-repo:/opt/sling/sling
    environment:
      - EXTRA_JAVA_OPTS=-Xmx1g -Dsling.run.modes=author,local
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u admin:admin http://localhost:8080/system/console/bundles.json | grep -q '\"state\":\"Active\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  publish:
    image: apache/sling:14
    container_name: blueshelf-publish
    ports:
      - "4503:8080"
    volumes:
      - publish-repo:/opt/sling/sling
    environment:
      - EXTRA_JAVA_OPTS=-Xmx1g -Dsling.run.modes=publish,local
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u admin:admin http://localhost:8080/system/console/bundles.json | grep -q '\"state\":\"Active\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Product/catalog microservice (Spring Boot). AEM (both tiers) calls it server-side via CatalogService.
  # From the containers: http://catalog-api:8081 ; from your laptop: http://localhost:8081
  catalog-api:
    build: ../catalog-api
    container_name: blueshelf-catalog-api
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  # Dispatcher (our Node model of Adobe's Apache module) in front of publish: filters + file cache + flush endpoint.
  # This is the ONLY thing the internet / the Next.js storefront talks to.   http://localhost:8080
  dispatcher:
    build: ../dispatcher
    container_name: blueshelf-dispatcher
    ports:
      - "8080:8080"
    volumes:
      - dispatcher-cache:/var/cache/dispatcher
    depends_on:
      - publish

volumes:
  dispatcher-cache:
  author-repo:
  publish-repo:
